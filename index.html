<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#06111f">
<title>Stabletiers — Minecraft Tierlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#"><span class="brandMark">◇</span><span>STABLETIERS</span><em>—</em></a>
  <div class="topModes" id="topModes"></div>
  <div class="topRight">
    <button class="serverPill" id="serverPill" type="button"><span class="dot"></span>STABLETIERS <small>›</small></button>
    <button class="mobileMenu" id="mobileMenu" type="button">☰</button>
  </div>
</header>

<main class="page">
  <section class="contentGrid">
    <div class="rankingColumn">
      <div class="rankingHeader">
        <div class="searchBox"><span>⌕</span><input id="search" placeholder="Spieler suchen..." autocomplete="off"></div>
        <button class="filterBtn" id="regionBtn"><span>◎</span> Region <b>⌄</b></button>
        <button class="filterBtn" id="sortBtn"><span>▥</span> Punkte <b>⌄</b></button>
      </div>
      <div class="tableHead"><span>#</span><span>SPIELER</span><span>REGION</span></div>
      <section id="players" aria-live="polite"></section>
    </div>

    <aside class="sidebar">
      <div class="heroCard">
        <div class="heroLogo">◇</div>
        <div><strong>Stabletiers</strong><span>Highest Tier. No Limits.</span></div>
      </div>
      <div class="statsCard" id="statsCard"></div>
      <div class="sideTitle">TIER-ÜBERSICHT</div>
      <div class="sideTiers" id="sideTiers"></div>
      <button class="profileBtn" id="sideProfileBtn">♟ &nbsp; Profil ansehen</button>
      <button class="adminBtn" id="adminBtn">⚙ &nbsp; Tier verwalten</button>
    </aside>
  </section>
</main>

<div class="modal" id="profileModal" aria-hidden="true">
  <div class="backdrop" data-close></div>
  <section class="panel profilePanel" role="dialog" aria-modal="true" aria-labelledby="profileName">
    <button class="close" data-close aria-label="Schließen">×</button>
    <div id="profileContent"></div>
  </section>
</div>

<div class="modal" id="adminModal" aria-hidden="true">
  <div class="backdrop" data-close-admin></div>
  <section class="panel adminPanel" role="dialog" aria-modal="true" aria-labelledby="adminTitle">
    <button class="close" data-close-admin aria-label="Schließen">×</button>
    <h2 id="adminTitle">Tier vergeben</h2>
    <p class="muted">MCTiers-style Verwaltung für Spieler und einzelne Gamemodes.</p>
    <div class="formGrid">
      <label>Spieler<select id="adminPlayer"></select></label>
      <label>Gamemode<select id="adminMode"></select></label>
      <label>Tier<select id="adminTier"></select></label>
    </div>
    <div class="adminActions"><button class="secondary" id="removeTier">Tier entfernen</button><button class="primary" id="saveTier">Tier speichern</button></div>
  </section>
</div>

<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
