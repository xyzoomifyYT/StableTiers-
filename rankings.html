<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StableTiers Rankings</title><link rel="stylesheet" href="css/style.css"></head><body><header class="topbar"><nav class="nav"><a href="index.html"><img src="assets/logo.svg"></a><a href="index.html">TIERLIST</a><a class="active" href="rankings.html">RANKS</a><a href="tests.html">TESTS</a><a href="rules.html">REGELN</a><a href="admin.html">ADMIN / TESTER</a><div class="userbox"><div class="avatar" data-user>?</div><b data-user>Spieler</b><button class="logout" onclick="logout()">Ausloggen</button></div></nav></header><main class="wrap"><section class="hero"><h1>Rankings</h1><p>Spieler nach ELO und Tier.</p></section><section class="card"><div class="search"><input id="q" class="input" placeholder="Spieler suchen..."><select id="mode" class="input"><option value="">Alle Modi</option></select></div><div id="list" style="margin-top:14px"></div></section></main><script src="js/app.js"></script><script>
MODES.forEach(m=>mode.innerHTML+=`<option>${m}</option>`);
function renderR(){let db=load(),q=document.getElementById("q").value.toLowerCase(),m=document.getElementById("mode").value;let a=Object.values(db.players).filter(p=>p.name.toLowerCase().includes(q)&&(!m||p.mode===m)).sort((x,y)=>y.elo-x.elo);list.innerHTML=a.map((p,i)=>`<div class="card" style="margin:8px 0;padding:12px;display:flex;justify-content:space-between"><b>#${i+1} ${escapeHtml(p.name)}</b><span>${tierBadge(p.tier)} · ${p.elo} ELO ${p.mode?`· ${p.mode}`:""}</span></div>`).join("")||'<p class="muted">Keine Spieler gefunden.</p>'}q.oninput=renderR;mode.onchange=renderR;document.addEventListener("DOMContentLoaded",renderR);</script></body></html>
