<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StableTiers Admin</title><link rel="stylesheet" href="css/style.css"></head><body><header class="topbar"><nav class="nav"><a href="index.html"><img src="assets/logo.svg"></a><a href="index.html">TIERLIST</a><a href="rankings.html">RANKS</a><a href="tests.html">TESTS</a><a href="rules.html">REGELN</a><a class="active" href="admin.html">ADMIN / TESTER</a></nav></header><main class="wrap"><section class="hero"><h1>Admin / Tester</h1><p>Demo-Verwaltung für lokale Tests.</p></section><section class="card"><div class="title">Offene Test-Anfragen</div><div id="apps"></div></section><section class="card"><div class="title">Daten</div><button class="btn secondary" onclick="exportData()">JSON exportieren</button> <button class="btn secondary" onclick="seedDemo()">Demo-Spieler laden</button></section></main><script src="js/app.js"></script><script>
function renderAdmin(){let db=load();let a=db.applications.filter(x=>x.status==="Offen");apps.innerHTML=a.map((x,i)=>`<div class="card" style="margin:8px 0"><b>${escapeHtml(x.player)}</b> · ${x.mode}<div class="muted">${escapeHtml(x.note||"Keine Notiz")}</div><div class="row" style="margin-top:9px"><select id="t${i}" class="input">${TIERS.map(t=>`<option>${t}</option>`).join("")}</select><button class="btn" onclick="finish(${i})">BESTANDEN & TIER VERGEBEN</button><button class="btn secondary" onclick="reject(${i})">ABLEHNEN</button></div></div>`).join("")||'<p class="muted">Keine offenen Anfragen.</p>'}
function finish(i){let db=load(),a=db.applications.filter(x=>x.status==="Offen"),x=a[i],p=db.players[x.player];p.tier=document.getElementById("t"+i).value;p.mode=x.mode;p.elo=Math.max(p.elo,1000);p.history.push({date:new Date().toLocaleString("de-DE"),mode:x.mode,tier:p.tier,tester:currentUser()});x.status="Bestanden";save(db);renderAdmin()}
function reject(i){let db=load(),a=db.applications.filter(x=>x.status==="Offen"),x=a[i];x.status="Abgelehnt";save(db);renderAdmin()}
function exportData(){let b=new Blob([JSON.stringify(load(),null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="stabletiers-data.json";a.click()}
function seedDemo(){const db=load();if(!db.players["zNXco"]){["zNXco","iCraze","xLunaa","Rexxy"].forEach((n,i)=>db.players[n]={name:n,elo:1000-i*50,wins:10,losses:2,tier:TIERS[i],mode:MODES[i],kd:"1.80",history:[]});save(db)}renderAdmin()}document.addEventListener("DOMContentLoaded",renderAdmin);</script></body></html>
