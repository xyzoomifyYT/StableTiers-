<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StableTiers Tests</title><link rel="stylesheet" href="css/style.css"></head><body><header class="topbar"><nav class="nav"><a href="index.html"><img src="assets/logo.svg"></a><a href="index.html">TIERLIST</a><a href="rankings.html">RANKS</a><a class="active" href="tests.html">TESTS</a><a href="rules.html">REGELN</a><a href="admin.html">ADMIN / TESTER</a><div class="userbox"><div class="avatar" data-user>?</div><b data-user>Spieler</b><button class="logout" onclick="logout()">Ausloggen</button></div></nav></header><main class="wrap"><section class="hero"><h1>Tests</h1><p>Kein Test = kein Tier.</p></section><section class="card"><div class="title">🎯 Test beantragen</div><div class="formrow"><div><label>Modus</label><select id="mode" class="input"></select></div><div><label>Hinweis</label><input id="note" class="input" placeholder="z. B. Crystal PvP"></div></div><button class="btn" style="margin-top:10px" onclick="apply()">TEST-ANFRAGE SENDEN</button><div id="msg" class="notice hidden"></div></section><section class="card"><div class="title">Meine Anfragen</div><div id="apps"></div></section></main><script src="js/app.js"></script><script>
MODES.forEach(m=>mode.innerHTML+=`<option>${m}</option>`);
function apply(){let db=load(),u=currentUser();db.applications.push({id:Date.now(),player:u,mode:mode.value,note:note.value,status:"Offen",date:new Date().toLocaleString("de-DE")});save(db);msg.classList.remove("hidden");msg.innerHTML="<b>Anfrage gesendet</b> Ein Tester kann deine Anfrage jetzt bearbeiten.";renderA()}
function renderA(){let db=load(),u=currentUser();let a=db.applications.filter(x=>x.player===u).reverse();apps.innerHTML=a.map(x=>`<div class="card" style="margin:8px 0"><b>${x.mode}</b> · ${x.status}<div class="muted">${x.date}</div></div>`).join("")||'<p class="muted">Noch keine Anfragen.</p>'}document.addEventListener("DOMContentLoaded",renderA);</script></body></html>
